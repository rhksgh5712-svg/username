<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 1인용 AI 오목 게임</title>
    
    <!-- PWA 관련 메타 태그 추가: manifest.json 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#374151">

    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        
        /* 오목판 스타일 */
        #game-board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            width: min(90vw, 600px);
            height: min(90vw, 600px);
            aspect-ratio: 1 / 1;
            background-color: #f7e7c3; /* 연한 나무색 */
            border: 4px solid #374151;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
        }

        .omok-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* 격자선 스타일 */
        .omok-cell::after, .omok-cell::before {
            content: '';
            position: absolute;
            background-color: #374151;
            z-index: 0;
            pointer-events: none;
        }
        /* 세로선 */
        .omok-cell:not(:nth-child(15n))::after {
            right: 0;
            top: 50%;
            width: 1px;
            height: 50%;
            transform: translateY(-50%);
        }
        /* 가로선 */
        .omok-cell:not(:nth-last-child(-n + 15))::before {
            bottom: 0;
            left: 50%;
            height: 1px;
            width: 50%;
            transform: translateX(-50%);
        }

        /* 돌 애니메이션 */
        .stone-black {
            background-color: #000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        .stone-white {
            background-color: #fff;
            border: 2px solid #374151;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .last-move-marker {
            animation: pulse-marker 1s infinite alternate;
        }

        @keyframes pulse-marker {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.5; transform: scale(1.1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white shadow-lg p-4 sticky top-0 z-50">
        <h1 class="text-3xl font-extrabold text-gray-900 text-center">
            🤖 AI 오목 게임 (PWA 호환)
        </h1>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col lg:flex-row gap-6">
        
        <!-- Board Area -->
        <div class="lg:w-3/5 w-full bg-white rounded-xl shadow-2xl p-2 flex items-center justify-center">
            <div id="game-board-container" class="p-4 flex justify-center items-center">
                <div id="game-board">
                    <!-- Board cells will be generated here by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="lg:w-2/5 w-full space-y-6">
            
            <!-- Game Status Card -->
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-500">
                <h2 class="text-xl font-semibold mb-2 text-gray-700">현재 상태</h2>
                <div id="status-message" class="text-2xl font-extrabold p-3 rounded-lg text-center transition duration-300 bg-blue-100 text-blue-600">
                    게임을 시작하세요!
                </div>
            </div>
            
            <!-- Game Control Card -->
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-green-500">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">게임 시작 / 재시작</h2>
                
                <button
                    id="start-button"
                    class="w-full font-bold py-3 px-4 rounded-lg transition duration-200 bg-green-500 hover:bg-green-600 text-white"
                    onclick="startGame()"
                >
                    새 게임 시작 (당신은 ⚫)
                </button>
            </div>

            <!-- Instruction Card -->
             <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500">
                <h2 class="text-xl font-semibold mb-2 text-gray-700">게임 규칙</h2>
                <ul class="text-sm text-gray-600 space-y-2 list-disc list-inside">
                    <li>당신은 **검은 돌 (⚫)**, AI는 **흰 돌 (⚪)** 입니다.</li>
                    <li>먼저 가로, 세로, 대각선 중 **5개의 돌**을 연속으로 놓으면 승리합니다.</li>
                    <li>이 파일은 안드로이드용 **PWA**로 설치하여 사용할 수 있습니다.</li>
                </ul>
            </div>
        </div>
    </main>
    
    <footer class="p-4 text-center text-sm text-gray-500 bg-gray-100 mt-auto">
        Omok Game vs AI. 15x15 board. Optimized for mobile and PWA.
    </footer>

    <script>
        // --- 1. 전역 상수 및 상태 ---
        const BOARD_SIZE = 15;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let currentPlayer = 'B'; // B: Human, W: AI
        let gameStatus = 'ready'; // ready, playing, B_wins, W_wins, draw
        let lastMove = null;
        let isAITurn = false;
        
        const humanPlayer = 'B';
        const aiPlayer = 'W';

        const AI_SCORES = {
            'WIN': 10000000,
            'BLOCK_WIN': 5000000,
            'OPEN_4': 50000,
            'BLOCK_OPEN_4': 5000,
            'CENTER_BONUS': 10
        };

        const boardElement = document.getElementById('game-board');
        const statusElement = document.getElementById('status-message');
        const startButton = document.getElementById('start-button');

        // PWA 서비스 워커 등록 (오프라인 캐싱 및 설치를 위해 필요)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // NOTE: 업로드하신 파일명인 'service-work.js'로 경로를 수정했습니다.
                navigator.serviceWorker.register('./service-work.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }


        // --- 2. 헬퍼 함수: 승리 판정 (checkWin) ---
        const checkWin = (currentBoard, r, c, player) => {
            if (!currentBoard[r][c]) return false;

            const directions = [
                [0, 1], [1, 0], [1, 1], [1, -1]
            ];

            for (const [dr, dc] of directions) {
                let count = 1;
                
                // Positive direction
                for (let i = 1; i < 5; i++) {
                    const nr = r + dr * i;
                    const nc = c + dc * i;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && currentBoard[nr][nc] === player) {
                        count++;
                    } else {
                        break;
                    }
                }

                // Negative direction
                for (let i = 1; i < 5; i++) {
                    const nr = r - dr * i;
                    const nc = c - dc * i;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && currentBoard[nr][nc] === player) {
                        count++;
                    } else {
                        break;
                    }
                }

                if (count >= 5) {
                    return true;
                }
            }
            return false;
        };

        // --- 3. AI 로직 함수 (getMoveScore, getBestMove) ---

        const getMoveScore = (tempBoard, r, c, player) => {
            const opponent = player === 'B' ? 'W' : 'B';
            tempBoard[r][c] = player;
            
            let score = 0;

            if (checkWin(tempBoard, r, c, player)) {
                score = AI_SCORES.WIN;
            } 
            
            const center = Math.floor(BOARD_SIZE / 2);
            const distance = Math.abs(r - center) + Math.abs(c - center);
            score += AI_SCORES.CENTER_BONUS / (distance + 1);

            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (const [dr, dc] of directions) {
                let aiCount = 0;
                let humanCount = 0;
                let openEnds = 0;

                for (let k = -4; k <= 4; k++) {
                    const nr = r + dr * k;
                    const nc = c + dc * k;

                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        const cell = tempBoard[nr][nc];
                        if (cell === player) {
                            aiCount++;
                        } else if (cell === opponent) {
                            humanCount++;
                        } else if (cell === null) {
                            if (aiCount > 0 || humanCount > 0) openEnds = 1; 
                        }
                    }
                }
                
                if (aiCount === 4) score += AI_SCORES.OPEN_4;
                if (aiCount === 3 && openEnds) score += AI_SCORES.OPEN_4 / 5;
                
                if (humanCount === 4) score = Math.max(score, AI_SCORES.BLOCK_OPEN_4 * 5);
                if (humanCount === 3 && openEnds) score = Math.max(score, AI_SCORES.BLOCK_OPEN_4);
            }

            tempBoard[r][c] = null;
            return score;
        };

        const getBestMove = (currentBoard, aiPlayer, humanPlayer) => {
            let bestScore = -Infinity;
            let bestMove = null;
            let availableMoves = [];

            // 탐색 범위 제한: 돌 주변 2칸 이내만 탐색
            const stones = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (currentBoard[r][c] !== null) {
                        stones.push({r, c});
                    }
                }
            }

            const explored = new Set();
            
            for (const stone of stones) {
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        const r = stone.r + dr;
                        const c = stone.c + dc;
                        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && currentBoard[r][c] === null) {
                            const key = `${r},${c}`;
                            if (!explored.has(key)) {
                                availableMoves.push({r, c});
                                explored.add(key);
                            }
                        }
                    }
                }
            }

            if (availableMoves.length === 0 && stones.length === 0) {
                // 보드가 텅 비었을 때 중앙 선택
                return { r: Math.floor(BOARD_SIZE / 2), c: Math.floor(BOARD_SIZE / 2) };
            }

            if (availableMoves.length === 0) {
                // 주변 탐색으로 찾지 못했다면 빈 칸 전체 탐색 (느려질 수 있음)
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (currentBoard[r][c] === null) {
                            availableMoves.push({r, c});
                        }
                    }
                }
            }
            
            for (const { r, c } of availableMoves) {
                const tempBoard = currentBoard.map(row => [...row]);

                let score = getMoveScore(tempBoard, r, c, aiPlayer);
                const humanThreatScore = getMoveScore(tempBoard, r, c, humanPlayer);
                
                if (humanThreatScore === AI_SCORES.WIN) {
                     score = Math.max(score, AI_SCORES.BLOCK_WIN);
                } else {
                     score = Math.max(score, humanThreatScore);
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = { r, c };
                }
            }

            if (!bestMove && availableMoves.length > 0) {
                // 최적의 수가 없다면 랜덤 선택
                return availableMoves[Math.floor(Math.random() * availableMoves.length)];
            }

            return bestMove;
        };

        // --- 4. 렌더링 및 상태 업데이트 ---
        const updateStatus = (message, status) => {
            let bgColor = 'bg-blue-100 text-blue-600';
            let buttonClass = 'bg-green-500 hover:bg-green-600 text-white';
            
            if (status === 'B_wins' || status === 'W_wins' || status === 'draw') {
                bgColor = 'bg-green-100 text-green-600';
                buttonClass = 'bg-red-500 hover:bg-red-600 text-white';
            } else if (currentPlayer === aiPlayer && gameStatus === 'playing') {
                bgColor = 'bg-gray-100 text-gray-600';
            }
            
            statusElement.textContent = message;
            statusElement.className = `text-2xl font-extrabold p-3 rounded-lg text-center transition duration-300 ${bgColor}`;
            
            startButton.textContent = gameStatus === 'ready' ? '새 게임 시작 (당신은 ⚫)' : '게임 재시작';
            startButton.className = `w-full font-bold py-3 px-4 rounded-lg transition duration-200 ${buttonClass}`;
        };

        const createStoneMarkup = (r, c) => {
            const player = board[r][c];
            if (!player) return '';

            const colorClass = player === 'B' ? 'stone-black' : 'stone-white';
            const isLast = lastMove && lastMove.r === r && lastMove.c === c;
            const lastMoveClass = isLast ? 'last-move-marker' : '';

            // 돌 마크업
            return `
                <div class="absolute w-[80%] h-[80%] rounded-full flex items-center justify-content justify-center z-20 transition-transform duration-100 ease-out ${colorClass} ${isAITurn && player === 'W' ? 'scale-110' : ''}">
                    ${isLast ? 
                        `<div class="w-1/3 h-1/3 rounded-full ${player === 'B' ? 'bg-yellow-400' : 'bg-red-500'} ${lastMoveClass}"></div>`
                        : ''}
                </div>
            `;
        };

        const renderBoard = () => {
            boardElement.innerHTML = '';
            
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'omok-cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => handleCellClick(r, c);

                    // 마우스 커서 설정
                    if (gameStatus === 'playing' && currentPlayer === humanPlayer && !board[r][c]) {
                        cell.style.cursor = 'pointer';
                    } else {
                        cell.style.cursor = 'default';
                    }

                    // 화점 (Star points) 표시
                    const isStarPoint = (
                        (r === 3 && c === 3) || (r === 3 && c === 11) || 
                        (r === 11 && c === 3) || (r === 11 && c === 11) ||
                        (r === 7 && c === 7) 
                    );

                    if (isStarPoint) {
                        const star = document.createElement('div');
                        star.className = 'absolute w-2 h-2 bg-gray-900 rounded-full z-10';
                        cell.appendChild(star);
                    }
                    
                    // 돌 표시
                    cell.innerHTML += createStoneMarkup(r, c);
                    
                    boardElement.appendChild(cell);
                }
            }
        };

        // --- 5. 게임 흐름 제어 ---

        const changePlayer = () => {
            currentPlayer = currentPlayer === humanPlayer ? aiPlayer : humanPlayer;
            
            if (currentPlayer === aiPlayer) {
                updateStatus('AI (⚪)의 차례입니다...', 'playing');
                isAITurn = true;
                // AI 턴 시작
                setTimeout(makeAiMove, 800);
            } else {
                updateStatus('당신의 차례입니다 (⚫)', 'playing');
                isAITurn = false;
            }
        };

        const makeMove = (r, c, player) => {
            board[r][c] = player;
            lastMove = { r, c };
            renderBoard();

            // 1. 승리 확인
            if (checkWin(board, r, c, player)) {
                gameStatus = player === humanPlayer ? 'B_wins' : 'W_wins';
                updateStatus(player === humanPlayer ? '축하합니다! 당신(⚫)이 이겼습니다!' : 'AI (⚪) 승리! 다시 시작하세요.', gameStatus);
                isAITurn = false;
                return true;
            } 
            
            // 2. 무승부 확인
            if (board.flat().every(cell => cell !== null)) {
                gameStatus = 'draw';
                updateStatus('무승부입니다! 다시 시작하세요.', 'draw');
                isAITurn = false;
                return true;
            }
            
            return false;
        };


        const makeAiMove = () => {
            if (gameStatus !== 'playing' || currentPlayer !== aiPlayer) return;

            const move = getBestMove(board, aiPlayer, humanPlayer);
            
            if (!move) {
                gameStatus = 'draw';
                updateStatus('AI가 둘 곳을 찾지 못했습니다. 무승부.', 'draw');
                isAITurn = false;
                return;
            }

            // 수를 놓은 후 승리/무승부 확인
            const isGameOver = makeMove(move.r, move.c, aiPlayer);

            if (!isGameOver) {
                changePlayer();
            }
            isAITurn = false; // 턴 종료
        };

        window.handleCellClick = (r, c) => {
            if (gameStatus !== 'playing' || currentPlayer !== humanPlayer || isAITurn || board[r][c] !== null) {
                if (gameStatus !== 'playing') updateStatus('게임을 시작 버튼을 눌러주세요.', gameStatus);
                else if (isAITurn) updateStatus('AI가 생각 중입니다...', gameStatus);
                else if (board[r][c] !== null) updateStatus('이미 돌이 놓인 자리입니다.', gameStatus);
                return;
            }
            
            // 수를 놓은 후 승리/무승부 확인
            const isGameOver = makeMove(r, c, humanPlayer);

            if (!isGameOver) {
                changePlayer();
            }
        };

        window.startGame = () => {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            currentPlayer = humanPlayer;
            gameStatus = 'playing';
            lastMove = null;
            isAITurn = false;
            
            updateStatus('당신의 차례입니다 (⚫)', 'playing');
            renderBoard();
        };

        // --- 6. 초기화 ---
        window.onload = () => {
            renderBoard();
            updateStatus('게임을 시작하세요!', 'ready');
        };

    </script>
</body>
</html>
